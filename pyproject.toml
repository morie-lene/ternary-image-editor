[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ternary-image-editor"
version = "0.6.0"
description = "Windows desktop editor for paired source and ternary-label images"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "PySide6>=6.8,<7",
  "scipy>=1.14,<2",
]

[project.gui-scripts]
ternary-image-editor = "ternary_image_editor.app:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ternary_image_editor"]

[tool.hatch.build.targets.sdist]
artifacts = [
  "docs/display-comparison-addendum.md",
  "tests/test_display_comparison_contract.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
  "performance: target-hardware performance probes",
  "windows: checks requiring a Windows host",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
